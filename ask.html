<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>打給客服</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--soft:#f7f9fb;--line:#e1e6ee;--text:#1f2a3a;--muted:#5f6b7a;--dim:#8a95a5;--accent:#2f6db5;--navy:#1f2a3a;--purple:#b07aa1;--green:#59a14f;--red:#e15759;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:24px 16px 40px}
.brand{font-size:13px;color:var(--dim);letter-spacing:.06em}
h1{font-size:26px;line-height:1.35;margin:6px 0 6px}
.sub{color:var(--muted);font-size:15px;margin:0 0 20px}
.card{background:var(--card);border-radius:18px;padding:20px 18px;box-shadow:0 1px 2px rgba(30,45,70,.05),0 8px 24px rgba(30,45,70,.06)}
label{display:block;font-size:14px;color:var(--muted);font-weight:700;margin:0 0 8px}
input,textarea{width:100%;font:inherit;font-size:17px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--soft);color:var(--text);outline:none}
input:focus,textarea:focus{border-color:var(--accent);background:#fff}
textarea{height:96px;resize:none}
.f{margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:7px 14px;font:inherit;font-size:14.5px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ex .chip{font-size:13.5px;text-align:left}
.cnt{text-align:right;font-size:12.5px;color:var(--dim);margin-top:4px}
button.send{width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;font:inherit;font-size:18px;font-weight:800;padding:15px;margin-top:4px}
button.send:disabled{opacity:.5}
.ok{display:none;text-align:center;padding:26px 10px}
.ok .big{font-size:42px}
.ok h2{margin:8px 0 6px;font-size:22px}
.ok p{color:var(--muted);margin:0 0 18px}
.ok button{border:1.5px solid var(--accent);background:#fff;color:var(--accent);border-radius:999px;font:inherit;font-weight:700;padding:9px 22px}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:20px}
.note{font-size:12.5px;color:var(--dim);margin-top:18px;line-height:1.6}
.res{margin:6px 0 18px;padding:18px;border-radius:14px;background:#e8f0fa;text-align:left}
.res .k{font-size:13px;color:var(--muted);font-weight:700}
.res .big{font-size:22px;font-weight:800;line-height:1.4;margin:4px 0}
.res .sub{font-size:14.5px;color:var(--muted)}
.res.urgent{background:#fdecec}.res.op{background:#f7f9fb}
.wait{color:var(--muted);font-size:15px;margin:6px 0 18px}
.wait i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin:0 3px;animation:bl 1s infinite}
.wait i:nth-child(2){animation-delay:.2s}.wait i:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.25}}
.mic{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 14px}
.micbtn{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:40px;display:grid;place-items:center;box-shadow:0 8px 22px rgba(47,109,181,.35);-webkit-tap-highlight-color:transparent}
.micbtn.on{background:var(--red);box-shadow:0 0 0 0 rgba(225,87,89,.5);animation:ring 1.2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(225,87,89,.45)}100%{box-shadow:0 0 0 22px rgba(225,87,89,0)}}
.mictx{font-size:14.5px;color:var(--muted);text-align:center;min-height:20px}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px;margin:4px 0 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
textarea.live{border-color:var(--red);background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">客服營運數位孿生平台 · 評審參與</div>
  <h1>換你當客戶，<br>打給客服說一句話</h1>
  <p class="sub">用講的或打字都可以。說完確認文字後按「撥出」，會即時出現在大螢幕，系統判斷完，你的手機會收到要轉哪個分機。</p>

  <div class="card" id="form">
    <div class="f"><label for="nm">你的稱呼（選填）</label><input id="nm" maxlength="12" placeholder="例：王經理"></div>
    <div class="f"><label>你是哪一類客戶？</label>
      <div class="chips" id="tier">
        <button type="button" class="chip on" data-v="未提供身分">不提供身分</button>
        <button type="button" class="chip" data-v="一般客戶">往來多年的一般客戶</button>
        <button type="button" class="chip" data-v="新開戶客戶">新開戶客戶</button>
        <button type="button" class="chip" data-v="貴賓理財">貴賓理財</button>
        <button type="button" class="chip" data-v="私人銀行">私人銀行</button>
      </div></div>
    <div class="f"><label for="tx">想問客服什麼？</label>
      <div class="mic" id="micWrap"><button type="button" class="micbtn" id="micBtn" aria-label="開始說話">🎤</button><div class="mictx" id="micTx">點一下開始說話</div></div>
      <div class="or" id="orLine">或打字</div>
      <textarea id="tx" maxlength="60" placeholder="例：我想買房子要跟你們借錢"></textarea>
      <div class="cnt" id="cnt">0 / 60</div>
      <div class="chips ex" style="margin-top:8px" id="ex">
        <button type="button" class="chip">信用卡好像被盜刷了</button>
        <button type="button" class="chip">定存下個月到期不知道怎麼放</button>
        <button type="button" class="chip">搞什麼 轉帳到現在還沒到</button>
        <button type="button" class="chip">想開戶順便辦信用卡</button>
        <button type="button" class="chip">我搬家了要改通訊地址</button>
      </div></div>
    <button type="button" class="send" id="send">📞 撥出</button>
    <div class="err" id="err"></div>
  </div>

  <div class="card ok" id="ok">
    <div class="big">📞</div>
    <h2>已送出</h2>
    <p id="okTx"></p>
    <div id="resBox" class="wait"><i></i><i></i><i></i><br>系統判斷中，請稍候…</div>
    <button type="button" id="again">再打一通</button>
  </div>

  <p class="note">此為提案競賽 Demo，資料皆為示意。請勿說出或輸入真實姓名、身分證字號、帳號或其他個人資料。語音由手機瀏覽器的語音辨識服務（Google／Apple）轉成文字，內容會經公開的訊息中繼服務傳送。</p>
</div>
<script>
const TOPIC=new URLSearchParams(location.search).get('topic')||'jev-twin-demo-3esef92xcajm';
const $=id=>document.getElementById(id);
let tier='未提供身分', last=0;
$('tier').onclick=e=>{const b=e.target.closest('.chip'); if(!b) return; tier=b.dataset.v; document.querySelectorAll('#tier .chip').forEach(x=>x.classList.toggle('on',x===b));};
$('ex').onclick=e=>{const b=e.target.closest('.chip'); if(!b) return; $('tx').value=b.textContent; upd();};
const upd=()=>$('cnt').textContent=`${$('tx').value.length} / 60`;
$('tx').addEventListener('input',upd);
$('send').onclick=async()=>{
  cancelAuto();
  const text=$('tx').value.trim(); $('err').textContent='';
  if(!text){ $('err').textContent='請先輸入一句話'; return; }
  if(Date.now()-last<5000){ $('err').textContent='請稍等幾秒再送出'; return; }
  $('send').disabled=true;
  try{
    const rid=Math.random().toString(36).slice(2,12).replace(/[^a-z0-9]/g,'x'), sentAt=Math.floor(Date.now()/1000)-5;
    const url=`https://ntfy.sh/${encodeURIComponent(TOPIC)}`, body=JSON.stringify({name:$('nm').value.trim(),tier,text,rid});
    let ok=false;
    try{ const ac=new AbortController(); const tm=setTimeout(()=>ac.abort(),6000);
      const r=await fetch(url,{method:'POST',body,signal:ac.signal}); clearTimeout(tm); ok=r.ok; }catch(_){}
    if(!ok){ const r=await fetch(`${url}/publish?message=${encodeURIComponent(body)}`); ok=r.ok; }  // 有些網路會擋 POST，改用 GET 備援
    if(!ok) throw new Error('send');
    last=Date.now(); $('okTx').textContent=`「${text}」`; $('form').style.display='none'; $('ok').style.display='block'; waitReply(rid,sentAt);
  }catch(err){ $('err').textContent='送出失敗，請確認網路後再試一次'; }
  $('send').disabled=false;
};
let waitTimer=null, waitES=null;
function stopWait(){ clearTimeout(waitTimer); clearInterval(waitTimer); waitTimer=null; if(waitES){ waitES.close(); waitES=null; } }
function waitReply(rid,since){
  const box=$('resBox'); box.className='wait'; box.innerHTML='<i></i><i></i><i></i><br>系統判斷中，請稍候…';
  const t0=Date.now(); stopWait();
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const base=`https://ntfy.sh/${encodeURIComponent(TOPIC+'-r-'+rid)}`;
  let done=false;
  const show=p=>{
    if(done) return; done=true; stopWait();
    box.className='res'+(p.kind==='urgent'?' urgent':p.kind==='operator'?' op':'');
    box.innerHTML=`<div class="k">${p.ai?'API 判斷':'系統判斷'}</div><div class="big">${esc(p.title)}</div><div class="sub">接聽窗口：${esc(p.desk)}　·　服務等級：${esc(p.pname)}</div>`;
  };
  // 長連線：回覆一送出就收到
  try{
    waitES=new EventSource(`${base}/sse?since=all`);
    waitES.onmessage=e=>{ try{ const d=JSON.parse(e.data); if(d.event==='message') show(JSON.parse(d.message)); }catch(_){} };
  }catch(_){}
  // 備援：長連線不通時定時查
  const tick=async()=>{
    if(done) return;
    if(Date.now()-t0>90000){ stopWait(); box.className='wait'; box.textContent='大螢幕忙線中，請看大螢幕上的結果'; return; }
    try{
      const r=await fetch(`${base}/json?poll=1&since=all`,{cache:'no-store'});
      for(const line of (await r.text()).split('\n').filter(Boolean)){ const d=JSON.parse(line); if(d.event==='message'){ show(JSON.parse(d.message)); return; } }
    }catch(_){}
  };
  // 備援每 1 秒查一次；40 秒後仍沒收到就放慢到 3 秒，避免用完手機的 ntfy 額度
  const loop=()=>{ if(done) return; tick(); waitTimer=setTimeout(loop,Date.now()-t0<40000?1000:3000); };
  waitTimer=setTimeout(loop,1000);
}
$('again').onclick=()=>{ stopWait(); cancelAuto(); $('micTx').textContent='點一下開始說話'; $('tx').value=''; upd(); $('ok').style.display='none'; $('form').style.display='block'; };

/* ---------- 語音輸入（瀏覽器內建語音辨識；不支援時隱藏，改打字） ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, listening=false, finalTx='', autoT=null, autoN=0;
function cancelAuto(){ if(autoT){ clearInterval(autoT); autoT=null; $('send').textContent='📞 撥出'; } }
function startAuto(){
  cancelAuto(); autoN=3; $('send').textContent=`${autoN} 秒後自動送出（點文字可修改）`;
  autoT=setInterval(()=>{ autoN--; if(autoN<=0){ cancelAuto(); $('send').click(); } else $('send').textContent=`${autoN} 秒後自動送出（點文字可修改）`; },1000);
}
$('tx').addEventListener('focus',()=>{ if(autoT){ cancelAuto(); $('micTx').textContent='可以修改文字，改好按撥出'; } });
if(!SR){ $('micWrap').style.display='none'; $('orLine').style.display='none'; }
else{
  $('micBtn').onclick=()=>{
    if(listening){ rec&&rec.stop(); return; }
    cancelAuto(); finalTx=''; $('err').textContent='';
    rec=new SR(); rec.lang='zh-TW'; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
    rec.onstart=()=>{ listening=true; $('micBtn').classList.add('on'); $('micBtn').textContent='■'; $('micTx').textContent='聆聽中…說完會自動停止，也可以再點一下結束'; $('tx').classList.add('live'); $('tx').value=''; upd(); };
    rec.onresult=e=>{
      let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const s=e.results[i][0].transcript; if(e.results[i].isFinal) finalTx+=s; else interim+=s; }
      $('tx').value=(finalTx+interim).slice(0,60); upd();
    };
    rec.onerror=e=>{
      const m={'not-allowed':'沒有麥克風權限，請在瀏覽器允許麥克風，或改用打字','service-not-allowed':'這個瀏覽器不能使用語音，請改用打字',
        'no-speech':'沒有聽到聲音，請再點一次重新說','network':'語音辨識需要網路，請確認連線或改用打字','audio-capture':'找不到麥克風，請改用打字'}[e.error];
      $('micTx').textContent=m||'語音辨識失敗，請再試一次或改用打字';
    };
    rec.onend=()=>{
      listening=false; $('micBtn').classList.remove('on'); $('micBtn').textContent='🎤'; $('tx').classList.remove('live');
      const t=$('tx').value.trim();
      if(t){ $('micTx').textContent='辨識完成，確認文字沒問題後按「撥出」'; $('send').focus(); }
      else if(!/麥克風|語音|聲音|網路/.test($('micTx').textContent)) $('micTx').textContent='點一下開始說話';
    };
    try{ rec.start(); }catch(_){ $('micTx').textContent='語音啟動失敗，請再點一次'; }
  };
}
</script>
</body>
</html>
